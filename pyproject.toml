[project]
name = "project-michelin"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.4",
    "google-genai>=1.55.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "pandas>=3.0.3",
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/michelin", "src/restaurant_ingestion"]
